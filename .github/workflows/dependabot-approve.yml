name: Dependabot Approval

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    name: Approve Dependabot PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and approve pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          if [[ -z "$PR_NUMBER" || "$RUN_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "No pull request from this repository is associated with the CI run."
            exit 0
          fi

          pr_data="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login' <<< "$pr_data")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_data")"
          draft="$(jq -r '.draft' <<< "$pr_data")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_data")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<< "$pr_data")"
          state="$(jq -r '.state' <<< "$pr_data")"

          if [[ "$author" != "dependabot[bot]" || "$base_ref" != "main" || "$draft" != "false" || "$head_sha" != "$RUN_HEAD_SHA" || "$head_repository" != "$GITHUB_REPOSITORY" || "$state" != "open" ]]; then
            echo "Pull request #${PR_NUMBER} failed its author, branch, state, or CI commit check."
            exit 0
          fi

          has_dependencies_label="$(jq -r 'any(.labels[]; .name == "dependencies")' <<< "$pr_data")"
          has_github_actions_label="$(jq -r 'any(.labels[]; .name == "github-actions")' <<< "$pr_data")"
          has_glide_core_label="$(jq -r 'any(.labels[]; .name == "glide-core")' <<< "$pr_data")"

          if [[ "$has_dependencies_label" != "true" || "$has_github_actions_label" == "$has_glide_core_label" ]]; then
            echo "Pull request #${PR_NUMBER} does not have one recognized Dependabot label set."
            exit 0
          fi

          mapfile -t changed_files < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          if (( ${#changed_files[@]} == 0 )); then
            echo "Pull request #${PR_NUMBER} has no changed files."
            exit 0
          elif [[ "$has_github_actions_label" == "true" ]]; then
            for file in "${changed_files[@]}"; do
              if [[ "$file" != .github/workflows/* ]]; then
                echo "GitHub Actions update contains unexpected file: ${file}"
                exit 0
              fi
            done
          elif (( ${#changed_files[@]} != 1 )) || [[ "${changed_files[0]}" != "valkey-glide" ]]; then
            echo "GLIDE core update must change only the valkey-glide submodule."
            exit 0
          fi

          approval_count="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --jq '[.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length')"
          if (( approval_count > 0 )); then
            echo "Pull request #${PR_NUMBER} already has a GitHub Actions approval."
            exit 0
          fi

          current_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "$current_head_sha" != "$RUN_HEAD_SHA" ]]; then
            echo "Pull request #${PR_NUMBER} changed after CI completed."
            exit 0
          fi

          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve --body "CI passed. Automated Dependabot approval."
