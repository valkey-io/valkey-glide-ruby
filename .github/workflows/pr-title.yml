name: PR Title

# Triggers must match valkey-glide's pr-title.yml, which this calls.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pr-title:
    permissions:
      contents: read
      pull-requests: read
      # Requested by the shared bot-prs job; the call fails to load without it.
      statuses: write
    uses: valkey-io/valkey-glide/.github/workflows/pr-title.yml@main
