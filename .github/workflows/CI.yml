name: CI

run-name: ${{ inputs.name || format('{0} @ {1} {2}', github.ref_name, github.sha, toJson(inputs)) }}

on:
  pull_request:
    paths:
      - lib/**
      - test/**
      - valkey-glide/ffi/**
      - .github/workflows/**
      - .github/json_matrices/**
      - Gemfile
      - Gemfile.lock
      - Rakefile
      - valkey.gemspec

  push:
    branches:
      - main
      - release-*

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      full-matrix:
        description: "Run the full matrix"
        type: boolean
        default: false
      run-with-macos:
        description: "Include macOS runners"
        type: choice
        options:
          - "false"
          - "use-self-hosted"
          - "use-github"
        default: "false"
      name:
        description: "Custom run name"
        type: string
        required: false

  workflow_call:
    inputs:
      run-with-macos:
        description: "Include macOS runners"
        type: string
        default: "false"

concurrency:
  group: ruby-${{ github.head_ref || github.ref }}-${{ toJson(inputs) }}
  cancel-in-progress: true

jobs:
  lint:
    name: Rubocop
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Lint
        run: bundle exec rubocop

  get-matrices:
    name: Get Matrices
    runs-on: ubuntu-latest
    outputs:
      engine-matrix-output: ${{ steps.create-matrices.outputs.engine-matrix-output }}
      host-matrix-output: ${{ steps.create-matrices.outputs.host-matrix-output }}
      version-matrix-output: ${{ steps.create-matrices.outputs.version-matrix-output }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Determine full matrix mode
        id: full-matrix
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || \
             [[ "${{ github.event_name }}" == "workflow_call" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full-matrix }}" == "true" ]]; then
            echo "run-full-matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-full-matrix=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create test matrices
        id: create-matrices
        uses: ./.github/workflows/create-test-matrices
        with:
          language-name: ruby
          run-full-matrix: ${{ steps.full-matrix.outputs.run-full-matrix }}
          run-with-macos: ${{ inputs.run-with-macos || 'false' }}

  build-native-library:
    name: Build Native Library / ${{ matrix.host.NAMED_OS }}-${{ matrix.host.ARCH }}
    needs: [get-matrices]
    runs-on: ${{ matrix.host.RUNNER }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.get-matrices.outputs.host-matrix-output) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Composite actions from the valkey-glide submodule use relative paths
      # (vs reusable workflows which use org/repo/path@ref syntax)
      - name: Install Rust
        uses: ./valkey-glide/.github/actions/install-rust
        with:
          target: ${{ matrix.host.TARGET }}

      - name: Install protoc
        uses: ./valkey-glide/.github/actions/install-protoc
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            valkey-glide/ffi/target/
          key: ${{ matrix.host.TARGET }}-cargo-${{ hashFiles('valkey-glide/ffi/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.host.TARGET }}-cargo-

      - name: Build native library
        working-directory: valkey-glide/ffi
        env:
          GLIDE_NAME: GlideRuby
          GLIDE_VERSION: ${{ github.ref_name }}
        run: cargo build --release

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.host.NAMED_OS }}-${{ matrix.host.ARCH }}
          path: valkey-glide/ffi/target/release/libglide_ffi.so
          if-no-files-found: error

  test-ruby:
    name: Test / Ruby ${{ matrix.version }} / ${{ matrix.engine.type }} ${{ matrix.engine.version }} / ${{ matrix.host.ARCH }}
    needs: [build-native-library, get-matrices]
    runs-on: ${{ matrix.host.RUNNER }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJson(needs.get-matrices.outputs.engine-matrix-output) }}
        version: ${{ fromJson(needs.get-matrices.outputs.version-matrix-output) }}
        host: ${{ fromJson(needs.get-matrices.outputs.host-matrix-output) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-lib-${{ matrix.host.NAMED_OS }}-${{ matrix.host.ARCH }}
          path: valkey-glide/ffi/target/release/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Valkey engine
        if: matrix.engine.type == 'valkey'
        uses: ./valkey-glide/.github/actions/install-engine
        with:
          engine-version: ${{ matrix.engine.version }}
          target: ${{ matrix.host.TARGET }}

      - name: Start standalone server on port 6379 (Valkey - from binary)
        if: matrix.engine.type == 'valkey'
        run: |
          valkey-server --port 6379 --daemonize yes --save "" --appendonly no
          for i in {1..30}; do
            if valkey-cli -p 6379 ping > /dev/null 2>&1; then
              echo "Standalone server is ready on port 6379!"
              break
            fi
            sleep 1
          done

      - name: Start standalone server on port 6379 (Redis - from Docker)
        if: matrix.engine.type == 'redis'
        run: |
          docker run -d \
            --name redis-standalone \
            --network host \
            ${{ matrix.engine.image }} \
            redis-server --port 6379 --save "" --appendonly no
          for i in {1..30}; do
            if docker exec redis-standalone redis-cli -p 6379 ping > /dev/null 2>&1; then
              echo "Standalone server is ready on port 6379!"
              break
            fi
            sleep 1
          done

      - name: Generate SSL certificates
        run: ruby test/fixtures/ssl/generate_certs.rb

      - name: Start TLS-enabled Valkey on port 6380
        run: |
          cat > /tmp/valkey-ssl.conf << 'EOF'
          port 0
          tls-port 6380
          tls-cert-file /ssl/server-cert.pem
          tls-key-file /ssl/server-key.pem
          tls-ca-cert-file /ssl/ca-cert.pem
          tls-auth-clients no
          tls-protocols "TLSv1.2 TLSv1.3"
          EOF

          docker run -d \
            --name valkey-ssl \
            -p 6380:6380 \
            -v $(pwd)/test/fixtures/ssl:/ssl:ro \
            -v /tmp/valkey-ssl.conf:/etc/valkey-ssl.conf:ro \
            ${{ matrix.engine.image }} \
            ${{ matrix.engine.type }}-server /etc/valkey-ssl.conf

          for i in {1..30}; do
            if docker exec valkey-ssl ${{ matrix.engine.type }}-cli --tls --insecure -p 6380 ping > /dev/null 2>&1; then
              echo "TLS Valkey is ready!"
              break
            fi
            sleep 1
          done

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.version }}
          bundler-cache: true

      - name: Run tests
        run: |
          if [[ "${{ matrix.engine.type }}" == "valkey" ]]; then
            bundle exec rake test
          else
            # Redis engines only run standalone tests (cluster_manager.py requires Valkey binary)
            bundle exec rake test:standalone
          fi

      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-report-ruby-${{ matrix.version }}-${{ matrix.engine.type }}-${{ matrix.engine.version }}-${{ matrix.host.NAMED_OS }}-${{ matrix.host.ARCH }}
          path: |
            test/reports/
            tmp/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload cluster logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-ruby-${{ matrix.version }}-${{ matrix.engine.type }}-${{ matrix.engine.version }}-${{ matrix.host.NAMED_OS }}-${{ matrix.host.ARCH }}
          path: valkey-glide/utils/clusters/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop containers and servers
        if: always()
        run: |
          docker stop valkey-ssl && docker rm valkey-ssl || true
          docker stop redis-standalone && docker rm redis-standalone || true
          valkey-cli -p 6379 shutdown nosave 2>/dev/null || true

  module-tests:
    name: Module Tests / ${{ matrix.engine.type }} ${{ matrix.engine.version }}
    needs: [build-native-library, get-matrices]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJson(needs.get-matrices.outputs.engine-matrix-output) }}
    steps:
      - name: Skip non-Valkey engines
        if: matrix.engine.type != 'valkey'
        run: |
          echo "Module tests only run against Valkey engines (--enable-module-command is Valkey-specific)"
          echo "Skipping ${{ matrix.engine.type }} ${{ matrix.engine.version }}"

      - name: Check out code
        if: matrix.engine.type == 'valkey'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download native library
        if: matrix.engine.type == 'valkey'
        uses: actions/download-artifact@v4
        with:
          name: native-lib-linux-x64
          path: valkey-glide/ffi/target/release/

      - name: Copy modules for testing
        if: matrix.engine.type == 'valkey'
        run: |
          mkdir -p test/fixtures
          cp .github/files/librejson-v2.8.15.so test/fixtures/redisjson.so
          chmod +x test/fixtures/redisjson.so
          cp .github/files/redisbloom-amd64-v2.6.12.so test/fixtures/redisbloom.so
          chmod +x test/fixtures/redisbloom.so
          cp .github/files/redisearch-amd64-v2.10.24.so test/fixtures/redisearch.so
          chmod +x test/fixtures/redisearch.so

      - name: Start Valkey with modules enabled
        if: matrix.engine.type == 'valkey'
        run: |
          docker run -d \
            --name valkey-modules \
            -p 6379:6379 \
            -v $(pwd)/test/fixtures:/tmp/modules:ro \
            ${{ matrix.engine.image }} \
            ${{ matrix.engine.type }}-server --enable-module-command yes

          for i in {1..30}; do
            if docker exec valkey-modules ${{ matrix.engine.type }}-cli ping > /dev/null 2>&1; then
              echo "Valkey is ready!"
              break
            fi
            sleep 1
          done

      - name: Set up Ruby
        if: matrix.engine.type == 'valkey'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run module tests
        if: matrix.engine.type == 'valkey'
        run: bundle exec ruby -Itest -Ilib test/standalone/commands_test.rb -n '/TestStandaloneModuleCommands/'
        env:
          MODULE_DIR: test/fixtures

      - name: Stop containers
        if: always() && matrix.engine.type == 'valkey'
        run: |
          docker stop valkey-modules && docker rm valkey-modules || true
