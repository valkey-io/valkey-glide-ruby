---
name: "Bug Report"
description: Report a bug
title: "(topic): (short issue description)"
labels: ["bug", "Untriaged user issue"]
assignees: []
body:
    - type: textarea
      id: description
      attributes:
          label: Describe the bug
          description: What is the problem? A clear and concise description of the bug.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: |
              What did you expect to happen?
      validations:
          required: true

    - type: textarea
      id: current
      attributes:
          label: Current Behavior
          description: |
              What actually happened?

              Please include full errors, uncaught exceptions, stack traces, and relevant logs.
              If service responses are relevant, please include wire logs.
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction Steps
          description: |
              Provide a self-contained, concise snippet of code that can be used to reproduce the issue.
              For more complex issues provide a repo with the smallest sample that reproduces the bug.

              Avoid including business logic or unrelated code, it makes diagnosis more difficult.
              The code sample should be an SSCCE. See http://sscce.org/ for details. In short, please provide a code sample that we can copy/paste, run and reproduce.
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Possible Solution
          description: |
              Suggest a fix/reason for the bug
      validations:
          required: false

    - type: textarea
      id: context
      attributes:
          label: Additional Information/Context
          description: |
              Anything else that might be relevant for troubleshooting this bug. Providing context helps us come up with a solution that is most useful in the real world.
      validations:
          required: false

    - type: input
      id: client-version
      attributes:
          label: Client version used
          description: The version of the valkey-glide gem
          placeholder: e.g. valkey-glide 0.1.0
      validations:
          required: true

    - type: input
      id: engine-version
      attributes:
          label: Engine type and version
          description: E.g. Valkey 8.0, Redis OSS 7.2
      validations:
          required: true

    - type: input
      id: engine-environment
      attributes:
          label: Engine Environment
          description: Specify the engine environment
          placeholder: e.g., Local, ElastiCache Serverless, ElastiCache Provision, Docker...
      validations:
          required: true

    - type: input
      id: operating-system
      attributes:
          label: OS
      validations:
          required: true

    - type: input
      id: ruby-version
      attributes:
          label: Ruby Version
          description: E.g. Ruby 3.3.0
      validations:
          required: true

    - type: textarea
      id: cluster-info
      attributes:
          label: Cluster information
          description: |
              Cluster information, cluster topology, number of shards, number of replicas, used data types.
      validations:
          required: false

    - type: textarea
      id: logs
      attributes:
          label: Logs
          description: |
              Client and/or server logs.
      validations:
          required: false

    - type: textarea
      id: other
      attributes:
          label: Other information
          description: |
              e.g. detailed explanation, stacktraces, related issues, suggestions how to fix, links for us to have context, eg. associated pull-request, stackoverflow, etc
      validations:
          required: false
