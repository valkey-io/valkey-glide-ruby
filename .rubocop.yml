inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'lib/valkey/protobuf/**/*.rb'

Style/StringLiterals:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Style/Documentation:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Max: 50
  Exclude:
    - 'lib/valkey.rb'
    - 'lib/valkey/opentelemetry.rb'
    - 'lib/valkey/bindings.rb'
    - 'test/**/*.rb'

Metrics/ClassLength:
  Exclude:
    - 'lib/valkey.rb'
    - 'test/**/*.rb'

Metrics/BlockLength:
  Exclude:
    - 'Rakefile'
    - 'lib/valkey.rb'

Style/IfUnlessModifier:
  Exclude:
    - 'test/test_helper.rb'

Metrics/BlockNesting:
  Exclude:
    - 'test_app/**/*.rb'

Metrics/ModuleLength:
  Exclude:
    - 'lib/valkey/request_type.rb'
    - 'lib/valkey/utils.rb'
    - 'lib/valkey/commands/*.rb'
    - 'lib/valkey/bindings.rb'
    - 'lib/valkey/opentelemetry.rb'
    - 'test/**/*.rb'

# This gem is backported to run on Ruby 2.7 (see required_ruby_version in
# valkey.gemspec), while TargetRubyVersion stays at 3.0 for general style.
# The two cops below assume the gem's minimum Ruby is 3.0, which isn't true here.
Style/HashExcept:
  Enabled: false   # Hash#except is Ruby 3.0+; we use Hash#reject to stay 2.7-compatible

Gemspec/RequiredRubyVersion:
  Enabled: false   # required_ruby_version (>= 2.6) is intentionally below TargetRubyVersion
